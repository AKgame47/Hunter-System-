project_id = "hunter-system"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[auth]
enabled = true
site_url = "huntersystem://auth-callback"
additional_redirect_urls = ["huntersystem://auth-callback"]
jwt_expiry = 900
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
minimum_password_length = 12

[storage]
enabled = true
file_size_limit = "10MiB"

[analytics]
enabled = false
