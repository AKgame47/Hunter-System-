services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hunter
      POSTGRES_USER: hunter
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: [hunter_postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hunter -d hunter"]
      interval: 10s
      timeout: 5s
      retries: 10
  api:
    build: ../backend
    restart: unless-stopped
    env_file: ../backend/.env
    depends_on:
      postgres: {condition: service_healthy}
    expose: ["8000"]
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
volumes:
  hunter_postgres:
